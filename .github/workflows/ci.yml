name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache frontend node modules
        uses: actions/cache@v4
        with:
          path: redigoFrontend/node_modules
          key: frontend-${{ matrix.node-version }}-${{ hashFiles('redigoFrontend/package-lock.json', 'redigoFrontend/package.json') }}

      - name: Install frontend dependencies
        run: npm ci --prefix redigoFrontend

      - name: Lint frontend (if script exists)
        run: |
          if grep -q '"lint"' redigoFrontend/package.json; then
            npm --prefix redigoFrontend run lint
          else
            echo "No frontend lint script found; skipping."
          fi

      - name: Build frontend
        run: npm --prefix redigoFrontend run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: redigoFrontend/dist

  backend:
    name: Backend — install, lint & audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache backend node modules
        uses: actions/cache@v4
        with:
          path: Redigobackend/node_modules
          key: backend-${{ matrix.node-version }}-${{ hashFiles('Redigobackend/package-lock.json', 'Redigobackend/package.json') }}

      - name: Install backend dependencies
        run: npm ci --prefix Redigobackend

      - name: Lint backend (if script exists)
        run: |
          if grep -q '"lint"' Redigobackend/package.json; then
            npm --prefix Redigobackend run lint
          else
            echo "No backend lint script found; skipping."
          fi

      - name: Run backend tests if defined
        run: |
          set -e
          if grep -v -q '"test": "echo' Redigobackend/package.json; then
            echo "Running backend tests"
            npm --prefix Redigobackend test
          else
            echo "No meaningful backend tests defined — skipping"
          fi

      - name: Run npm audit (high) — report but don't fail pipeline
        run: npm --prefix Redigobackend audit --audit-level=high || true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency review
        uses: github/dependency-review-action@v2

  docker-build:
    name: Docker build & optional push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/heads/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ github.repository_owner }}/redigo-backend:latest -f Redigobackend/Dockerfile . || echo "No backend Dockerfile or build failed"

      - name: Push to GitHub Container Registry (if GHCR_PAT provided)
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "${GHCR_PAT}" ]; then
            echo "Pushing image to GHCR"
            echo "${GHCR_PAT}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker tag ${{ github.repository_owner }}/redigo-backend:latest ghcr.io/${{ github.repository_owner }}/redigo-backend:latest
            docker push ghcr.io/${{ github.repository_owner }}/redigo-backend:latest
          else
            echo "GHCR_PAT not set; skipping push to GHCR."
          fi
